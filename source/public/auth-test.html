<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prueba de acceso | EDULAG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            color: #243039;
        }

        .card {
            width: 100%;
            max-width: 680px;
            padding: 32px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .description {
            margin-bottom: 24px;
            color: #5d6970;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        #login-button {
            background: #0067b8;
            color: white;
        }

        #logout-button {
            background: #dfe5e8;
            color: #243039;
        }

        #solicitud-button {
            background: #21a366;
            color: white;
        }

        .request-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #dfe5e8;
        }

        .request-section[hidden] {
            display: none;
        }

        .request-section h2 {
            margin: 0 0 16px;
            font-size: 20px;
        }

        .request-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field-full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #b7c1c7;
            border-radius: 8px;
            background: white;
            color: #243039;
            font: inherit;
        }

        textarea {
            min-height: 92px;
            resize: vertical;
        }

        #crear-solicitud-button {
            justify-self: start;
            background: #21a366;
            color: white;
        }

        #result {
            min-height: 100px;
            margin-top: 24px;
            padding: 16px;
            overflow: auto;
            border-radius: 8px;
            background: #152027;
            color: #e8f1f5;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .success {
            border-left: 6px solid #21a366;
        }

        .error {
            border-left: 6px solid #d83b01;
        }

        @media (max-width: 600px) {
            .card {
                padding: 24px;
            }

            .request-form {
                grid-template-columns: 1fr;
            }

            .field-full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Acceso a Intranet EDULAG</h1>

        <p class="description">
            Prueba temporal de inicio de sesión utilizando
            la cuenta institucional de Microsoft.
        </p>

        <div class="buttons">
            <button id="login-button" disabled>
                Iniciar sesión con Microsoft
            </button>

            <button id="logout-button" disabled>
                Cerrar sesión
            </button>

            <button id="solicitud-button" disabled>
                Probar solicitud
            </button>
        </div>

        <section
            id="request-section"
            class="request-section"
            hidden
        >
            <h2>Nueva solicitud de entrada o salida</h2>

            <form id="request-form" class="request-form">
                <div class="field">
                    <label for="request-type">
                        Tipo de solicitud
                    </label>

                    <select id="request-type" required>
                        <option value="ENTRADA_TARDE">
                            Entrada tarde
                        </option>
                        <option value="SALIDA_TEMPRANO">
                            Salida temprano
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label for="request-date">Fecha</label>
                    <input
                        id="request-date"
                        type="date"
                        required
                    >
                </div>

                <div class="field">
                    <label for="request-time">
                        Hora solicitada
                    </label>
                    <input
                        id="request-time"
                        type="time"
                        required
                    >
                </div>

                <div class="field field-full">
                    <label for="request-reason">Motivo</label>
                    <textarea
                        id="request-reason"
                        maxlength="500"
                        required
                        placeholder="Explica brevemente el motivo de tu solicitud."
                    ></textarea>
                </div>

                <div class="field field-full">
                    <label for="request-observations">
                        Observaciones (opcional)
                    </label>
                    <textarea
                        id="request-observations"
                        maxlength="500"
                        placeholder="Agrega información complementaria si es necesaria."
                    ></textarea>
                </div>

                <button
                    id="crear-solicitud-button"
                    class="field-full"
                    type="submit"
                >
                    Enviar solicitud
                </button>
            </form>
        </section>

        <pre id="result">Preparando autenticación...</pre>
    </main>

    <script type="module">
        import {
            createClient
        } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const loginButton =
            document.querySelector('#login-button');

        const logoutButton =
            document.querySelector('#logout-button');

        const result =
            document.querySelector('#result');

        const solicitudButton =
            document.querySelector(
                '#solicitud-button'
            );

        const requestSection =
            document.querySelector('#request-section');

        const requestForm =
            document.querySelector('#request-form');

        const requestType =
            document.querySelector('#request-type');

        const requestDate =
            document.querySelector('#request-date');

        const requestTime =
            document.querySelector('#request-time');

        const requestReason =
            document.querySelector('#request-reason');

        const requestObservations =
            document.querySelector('#request-observations');

        const crearSolicitudButton =
            document.querySelector(
                '#crear-solicitud-button'
            );

        let sessionActual = null;

        let supabase;

        function fechaLocalISO() {
            const ahora = new Date();

            ahora.setMinutes(
                ahora.getMinutes() -
                ahora.getTimezoneOffset()
            );

            return ahora.toISOString().slice(0, 10);
        }

        function cambiarEstadoFormulario(habilitado) {
            requestSection.hidden = !habilitado;

            for (const control of requestForm.elements) {
                control.disabled = !habilitado;
            }
        }

        function mostrarResultado(
            contenido,
            tipo = ''
        ) {
            result.className = tipo;

            result.textContent =
                typeof contenido === 'string'
                    ? contenido
                    : JSON.stringify(contenido, null, 2);
        }

        async function validarAcceso(session) {
            sessionActual = session;

            mostrarResultado(
                'Microsoft confirmó tu identidad. ' +
                'Validando autorización en EDULAG...'
            );

            const response = await fetch(
                '/api/auth/me',
                {
                    headers: {
                        Authorization:
                            `Bearer ${session.access_token}`
                    }
                }
            );

            const data = await response.json();

            logoutButton.disabled = false;

            if (!response.ok) {
                mostrarResultado(data, 'error');
                solicitudButton.disabled = true;
                cambiarEstadoFormulario(false);
                return;
            }

            mostrarResultado(data, 'success');

            loginButton.disabled = true;

            solicitudButton.disabled =
                !data.perfil?.puedeSolicitar;

            cambiarEstadoFormulario(
                Boolean(data.perfil?.puedeSolicitar)
            );
        }

        async function crearSolicitud(event) {
            event.preventDefault();

            if (!sessionActual) {
                mostrarResultado(
                    {
                        ok: false,
                        mensaje:
                            'No existe una sesión activa.'
                    },
                    'error'
                );

                return;
            }

            crearSolicitudButton.disabled = true;

            mostrarResultado(
                'Creando la solicitud en Supabase y sincronizando con SharePoint...'
            );

            try {
                const response = await fetch(
                    '/api/solicitudes/entrada-salida',
                    {
                        method: 'POST',
                        headers: {
                            Authorization:
                                `Bearer ${sessionActual.access_token}`,
                            'Content-Type':
                                'application/json'
                        },
                        body: JSON.stringify({
                            tipo: requestType.value,
                            fecha: requestDate.value,
                            horaSolicitada: requestTime.value,
                            motivo: requestReason.value,
                            observaciones:
                                requestObservations.value || null
                        })
                    }
                );

                const data = await response.json();

                mostrarResultado(
                    data,
                    response.ok ? 'success' : 'error'
                );

                if (response.ok) {
                    requestReason.value = '';
                    requestObservations.value = '';
                }
            } catch (error) {
                mostrarResultado(
                    {
                        ok: false,
                        mensaje:
                            'No fue posible enviar la solicitud.',
                        error: error.message
                    },
                    'error'
                );
            } finally {
                crearSolicitudButton.disabled = false;
            }
        }

        async function probarSolicitud() {
            if (!sessionActual) {
                mostrarResultado(
                    {
                        ok: false,
                        mensaje:
                            'No existe una sesión activa.'
                    },
                    'error'
                );

                return;
            }

            solicitudButton.disabled = true;

            mostrarResultado(
                'Validando si el perfil puede crear ' +
                'una solicitud...'
            );

            try {
                const response = await fetch(
                    '/api/solicitudes/prueba',
                    {
                        method: 'POST',

                        headers: {
                            Authorization:
                                `Bearer ${sessionActual.access_token}`,

                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            tipo:
                                'PRUEBA_TECNICA'
                        })
                    }
                );

                const data =
                    await response.json();

                mostrarResultado(
                    data,
                    response.ok
                        ? 'success'
                        : 'error'
                );
            } catch (error) {
                mostrarResultado(
                    {
                        ok: false,
                        mensaje:
                            'No fue posible ejecutar ' +
                            'la prueba de solicitud.',
                        error:
                            error.message
                    },
                    'error'
                );
            } finally {
                solicitudButton.disabled = false;
            }
        }

        async function iniciarSesion() {
            loginButton.disabled = true;

            mostrarResultado(
                'Abriendo el inicio de sesión de Microsoft...'
            );

            const { error } =
                await supabase.auth.signInWithOAuth({
                    provider: 'azure',
                    options: {
                        scopes: 'email',

                        redirectTo:
                            `${window.location.origin}/auth-test.html`,

                        queryParams: {
                            prompt: 'login'
                        }
                    }
                });

            if (error) {
                mostrarResultado(
                    {
                        ok: false,
                        mensaje:
                            'No se pudo iniciar el acceso con Microsoft.',
                        error: error.message
                    },
                    'error'
                );

                loginButton.disabled = false;
            }
        }

        async function cerrarSesion() {
            const { error } =
                await supabase.auth.signOut();

            if (error) {
                mostrarResultado(
                    {
                        ok: false,
                        mensaje:
                            'No se pudo cerrar la sesión.',
                        error: error.message
                    },
                    'error'
                );

                return;
            }

            mostrarResultado(
                'Sesión cerrada correctamente.'
            );

            sessionActual = null;

            loginButton.disabled = false;
            logoutButton.disabled = true;
            solicitudButton.disabled = true;
            cambiarEstadoFormulario(false);
        }

        async function prepararPrueba() {
            try {
                const configResponse =
                    await fetch('/api/auth/config');

                const config =
                    await configResponse.json();

                if (!configResponse.ok) {
                    throw new Error(
                        config.mensaje ||
                        'No se pudo obtener la configuración.'
                    );
                }

                supabase = createClient(
                    config.supabaseUrl,
                    config.supabasePublishableKey,
                    {
                        auth: {
                            persistSession: true,
                            autoRefreshToken: true,
                            detectSessionInUrl: true
                        }
                    }
                );

                loginButton.addEventListener(
                    'click',
                    iniciarSesion
                );

                logoutButton.addEventListener(
                    'click',
                    cerrarSesion
                );

                solicitudButton.addEventListener(
                    'click',
                    probarSolicitud
                );

                requestForm.addEventListener(
                    'submit',
                    crearSolicitud
                );

                const hoy = fechaLocalISO();

                requestDate.min = hoy;
                requestDate.value = hoy;

                const {
                    data: { session },
                    error
                } = await supabase.auth.getSession();

                if (error) {
                    throw error;
                }

                if (session) {
                    await validarAcceso(session);
                    return;
                }

                mostrarResultado(
                    'Configuración correcta. ' +
                    'Presiona “Iniciar sesión con Microsoft”.'
                );

                loginButton.disabled = false;
            } catch (error) {
                mostrarResultado(
                    {
                        ok: false,
                        mensaje:
                            'No fue posible preparar la prueba.',
                        error: error.message
                    },
                    'error'
                );
            }
        }

        prepararPrueba();
    </script>
</body>

</html>
